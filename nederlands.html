<main>

  <ol class="deck">
    <li><button class="card" aria-pressed="false"><span class="q">Uit welke onderdelen bestaat het communicatieschema?</span><span class="a">Zender → boodschap → kanaal → ontvanger, en de ontvanger geeft feedback terug.<br>Ruis is alles wat de boodschap stoort, zoals lawaai, een slechte verbinding of moeilijke woorden.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Uit welke tekstelementen bestaat een tekst?</span><span class="a">Titel, inleiding, midden en slot, verdeeld in alinea's.<br>Een alinea is een groep zinnen over één deelonderwerp. De kernzin staat meestal vooraan.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is de I-M-S-structuur?</span><span class="a">Inleiding: trekt de aandacht en stelt het onderwerp voor.<br>Midden: werkt het onderwerp uit, één deelonderwerp per alinea.<br>Slot: vat samen of geeft een besluit.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen formeel en informeel taalgebruik?</span><span class="a">Formeel: beleefd, standaardtaal, u, volledige zinnen. Bijvoorbeeld een mail aan een leerkracht.<br>Informeel: spreektaal, je/jij, afkortingen. Bijvoorbeeld een bericht aan een vriend.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen verbale en non-verbale communicatie?</span><span class="a">Verbaal: met woorden, gesproken of geschreven.<br>Non-verbaal: zonder woorden, zoals lichaamshouding, gezichtsuitdrukking, gebaren, oogcontact en afstand.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is duurzame voeding?</span><span class="a">Voeding die gezond is voor jezelf en weinig schade doet aan mens, dier en milieu: meer plantaardig, lokaal en seizoensgebonden, weinig verspilling en eerlijke handel.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen een feit en een mening?</span><span class="a">Feit: kan je controleren, het is waar of niet waar. "Een appel bevat vezels."<br>Mening: wat iemand vindt, niet te controleren. "Appels zijn het lekkerste fruit." Signaalwoorden: ik vind, volgens mij, lekker, mooi.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat betekenen objectief en subjectief?</span><span class="a">Objectief: zakelijk en neutraal, alleen feiten, zonder eigen mening.<br>Subjectief: gekleurd door de mening of gevoelens van de schrijver.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen tekstdoel en tekstsoort?</span><span class="a">Tekstdoel: waarom de tekst geschreven is, bijvoorbeeld informeren, overtuigen, instrueren of ontspannen.<br>Tekstsoort: de vorm van de tekst, zoals een nieuwsbericht (informeren), reclame of betoog (overtuigen), recept (instrueren) of verhaal (ontspannen).</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe bepaal je het teksttype?</span><span class="a">Kijk naar de vorm en waar de tekst verschijnt:<br>Boek: lange tekst in hoofdstukken.<br>Krantenartikel: titel, lead en kolommen, met nieuws of achtergrond.<br>Affiche: weinig tekst, grote letters en een beeld, om snel op te vallen.<br>Recept: ingrediëntenlijst en genummerde stappen.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen onderwerp en hoofdgedachte?</span><span class="a">Onderwerp: waarover de tekst gaat, in een paar woorden. "Duurzame voeding."<br>Hoofdgedachte: de belangrijkste boodschap over dat onderwerp, in één zin. "Wie minder vlees eet, spaart het milieu."<br>Tip: kijk naar de titel, de inleiding en het slot.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe formuleer je een standpunt met sterke argumenten?</span><span class="a">Standpunt: je mening in één duidelijke zin. "Onze school moet meer vegetarische maaltijden aanbieden."<br>Sterk argument: steunt op een feit, is controleerbaar en past bij je standpunt.<br>Zwak argument: alleen een gevoel of mening, zoals "omdat ik het lekker vind".</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke leesstrategieën ken je?</span><span class="a">Voor het lezen: oriënteren op titel, tussentitels en afbeeldingen, en voorspellen waarover het gaat.<br>Tijdens het lezen: globaal lezen (de grote lijn), zoekend lezen (één gegeven vinden) of intensief lezen (alles grondig begrijpen).</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke 5 woordenschatstrategieën ken je?</span><span class="a">1. De betekenis afleiden uit de zinnen ervoor en erna<br>2. Het woord opdelen in stukken die je kent<br>3. Vergelijken met een woord dat je al kent, ook uit een andere taal<br>4. Uitleg of een afbeelding in de tekst gebruiken<br>5. Opzoeken in een woordenboek of het vragen</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is een recensie?</span><span class="a">Een tekst waarin je een boek, film, restaurant of product kort beschrijft en beoordeelt. Een recensie combineert feiten met een mening die je met argumenten onderbouwt.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe schrijf je een recensie?</span><span class="a">Titel: pakkend en met de naam van wat je bespreekt.<br>Inleiding: wat bespreek je, met de belangrijkste gegevens.<br>Midden: korte inhoud zonder het einde te verklappen, sterke en zwakke punten met argumenten.<br>Slot: je eindoordeel en voor wie je het aanraadt.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wanneer schrijf je wel en geen hoofdletter?</span><span class="a">Wel: begin van een zin, namen van personen, landen, steden en straten, talen en inwoners (Nederlands, Belg), merknamen en feestdagen (Kerstmis, Pasen, Nieuwjaar).<br>Niet: dagen, maanden en seizoenen (maandag, december, winter), windrichtingen, en samenstellingen met een feestdag (kerstboom, paasei, nieuwjaarsbrief).</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe schrijf je een samenstelling correct?</span><span class="a">Een samenstelling is één woord, dus aan elkaar: feest + dag = feestdag.<br>Soms komt er een tussenletter: -s- (nieuwjaarsbrief) of -en- als het eerste deel een meervoud op -en heeft (pannenkoek).<br>Een koppelteken bij klinkerbotsing: auto-ongeluk, zee-egel.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is een synoniem en waarom gebruik je het?</span><span class="a">Een woord met (bijna) dezelfde betekenis: cadeau en geschenk, feest en fuif. Je gebruikt synoniemen om herhaling in je tekst te vermijden.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de 10 wettelijke feestdagen in België?</span><span class="a">Nieuwjaar (1 jan), Paasmaandag, Dag van de Arbeid (1 mei), O.L.H.-Hemelvaart, Pinkstermaandag, Nationale feestdag (21 juli), O.L.V.-Hemelvaart (15 aug), Allerheiligen (1 nov), Wapenstilstand (11 nov), Kerstmis (25 dec).</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen een traditie en een ritueel?</span><span class="a">Traditie: een gewoonte die van generatie op generatie wordt doorgegeven, zoals een kerstboom zetten.<br>Ritueel: vaste handelingen in een vaste volgorde met een symbolische betekenis, zoals om middernacht klinken op het nieuwe jaar.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe is een nieuwjaarsbrief opgebouwd?</span><span class="a">Bovenaan plaats en datum.<br>Aanspreking: "Lieve meter,"<br>Inleiding: je nieuwjaarswensen.<br>Midden: bedanken voor het voorbije jaar en je goede voornemens.<br>Slot: wensen herhalen, groet en je naam.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe maak je een mindmap?</span><span class="a">Het onderwerp in het midden, hoofdtakken met kernwoorden errond, zijtakken voor details. Gebruik kernwoorden in plaats van zinnen, en kleuren of tekeningen om te ordenen.</span></button></li>
  </ol>
