  <ol class="deck">
    <li><button class="card" aria-pressed="false"><span class="q">Hoe maak of vul je een tijdlijn aan?</span><span class="a">Kies een begin- en eindjaar en verdeel de lijn in gelijke stukken (bijvoorbeeld 1 cm = 100 jaar). Zet elke gebeurtenis op de juiste plek, van oud links naar recent rechts. Geef je tijdlijn een titel.<br>Let op: v.C. telt terug, en een jaar 0 bestaat niet.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de tijdsperiodes?</span><span class="a">Prehistorie: tot ± 3000 v.C. (geen schrift)<br>Oudheid: 3000 v.C. – 500<br>Middeleeuwen: 500 – 1500<br>Nieuwe Tijd: 1500 – 1750<br>Nieuwste Tijd: 1750 – nu</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">In welke periode plaats je deze krantenkoppen?</span><span class="a">Jagers doden een mammoet → Prehistorie<br>Tempel voor Zeus gebouwd → Oudheid<br>Nieuwe kathedraal en kasteel klaar → Middeleeuwen<br>Columbus bereikt Amerika → Nieuwe Tijd<br>Eerste stoommachine, eerste smartphone → Nieuwste Tijd</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen een mythe en folklore?</span><span class="a">Mythe: een oud verhaal over goden en helden dat iets verklaart, zoals het ontstaan van de wereld of het weer. Mensen geloofden het vroeger echt. Voorbeeld: Zeus die bliksems gooit.<br>Folklore: de volkscultuur van een gemeenschap, zoals gewoonten, feesten, liederen en sagen die van generatie op generatie worden doorgegeven. Voorbeeld: Sinterklaas, reuzenstoeten.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe veranderde het belang van de Olympus?</span><span class="a">Vroeger: de heilige woonplaats van de Griekse goden.<br>Nu: de hoogste berg van Griekenland, een natuurpark waar toeristen en bergwandelaars komen.<br>De betekenis verschoof van religieus naar natuur en toerisme.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen een primaire en een secundaire bron?</span><span class="a">Primaire bron: komt uit de tijd zelf of van iemand die erbij was, zoals een dagboek, foto, voorwerp of krantenartikel van toen.<br>Secundaire bron: later gemaakt over die tijd, zoals een schoolboek, documentaire of website.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke vragen stel je om een bron te analyseren?</span><span class="a">Soort: tekst, beeld of voorwerp? Primair of secundair?<br>Wie maakte het, wanneer en waar?<br>Met welk doel: informeren, overtuigen, propaganda?<br>Is de bron objectief of subjectief, en dus hoe betrouwbaar?</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat betekenen objectief en subjectief bij een bron?</span><span class="a">Objectief: geeft feiten, zonder mening van de maker.<br>Subjectief: gekleurd door de mening of gevoelens van de maker. Een bron die wil overtuigen is meestal subjectief.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke voedsel(r)evoluties ken je uit de geschiedenis?</span><span class="a">Prehistorie: van jagen en verzamelen naar landbouw en veeteelt (landbouwrevolutie).<br>Nieuwe Tijd: aardappel, tomaat, maïs en cacao komen uit Amerika naar Europa.<br>Nieuwste Tijd: conservenblik, koeling en massaproductie.<br>Nu: supermarkten, fastfood, voedsel van over de hele wereld en meer plantaardig eten.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Zet de geschiedenis van de Dag van de Arbeid in de juiste volgorde</span><span class="a">1886: staking in Chicago voor de achturendag<br>1889: 1 mei wordt uitgeroepen tot internationale dag van de arbeid<br>1890: eerste 1-meivieringen in Europa<br>1947: 1 mei wordt een wettelijke feestdag in België<br>Tip: orden jaartallen van oud naar nieuw. Bij v.C. is een groter getal ouder.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe verschilt Kerstmis vroeger en nu?</span><span class="a">Vroeger: vooral religieus (de geboorte van Jezus, de nachtmis), sober, met familie, eenvoudige of zelfgemaakte cadeaus.<br>Nu: minder religieus en meer commercieel: veel cadeaus, reclame, kerstmarkten, de kerstman en foto's op sociale media.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke moderne invloeden veranderen feestdagen?</span><span class="a">Sociale media: feesten worden gedeeld en trends verspreiden snel.<br>Internet: online cadeaus kopen, digitale wenskaarten.<br>Commercialisering: winkels maken van een feest een verkoopmoment.<br>Secularisering: de religieuze betekenis wordt kleiner.<br>Globalisering: feesten uit andere landen komen naar hier, zoals Halloween en Black Friday.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe zoek je een actuele gebeurtenis op de kaart?</span><span class="a">Zoek de plaats of het land in het register van je atlas. Daar staan het kaartnummer en de coördinaten (letter en cijfer). Zoek het op de kaart en benoem het werelddeel en de windrichting ten opzichte van België.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen een continent en een wereldregio?</span><span class="a">Continent: een groot, aaneengesloten stuk land, zoals Europa, Azië, Afrika, Noord-Amerika, Zuid-Amerika, Oceanië en Antarctica.<br>Wereldregio: een groep landen met gemeenschappelijke kenmerken (cultuur, economie, ligging), zoals het Midden-Oosten of Latijns-Amerika. Een wereldregio kan over de grens van een continent gaan.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is een voedselkilometer en hoe bereken je het?</span><span class="a">De afstand die voedsel aflegt van waar het groeit of gemaakt wordt tot op je bord.<br>Meet de afstand op de kaart en reken om met de schaal, of gebruik een routeplanner. Sorteer daarna van verst naar dichtst.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Waarom zijn veel voedselkilometers slecht?</span><span class="a">Transport per vliegtuig, schip en vrachtwagen stoot CO₂ uit en draagt bij aan de opwarming van de aarde. Het is niet duurzaam. Geïmporteerd veevoer zoals soja leidt ook tot ontbossing, bijvoorbeeld in de Amazone.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de negatieve gevolgen van vleesproductie?</span><span class="a">Herkauwers stoten methaangas uit, een sterk broeikasgas. Mest vervuilt bodem en water. Er is veel land en water nodig, en bossen worden gekapt voor weiden en veevoer. Samen draagt dit bij aan de opwarming van de aarde.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Waarom is de aarde verdeeld in tijdzones?</span><span class="a">De aarde draait in 24 uur één keer rond haar as (360°). Per uur is dat 15°, dus zijn er 24 tijdzones. Zo is het overal ongeveer 12 uur als de zon het hoogst staat. België zit in de winter op UTC+1.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Waar wordt Nieuwjaar het eerst gevierd?</span><span class="a">Op Kiritimati, een eiland van Kiribati in de Stille Oceaan (UTC+14), vlak bij de datumgrens. Kort daarna volgen Nieuw-Zeeland en Australië.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is duurzaamheid?</span><span class="a">Zo leven en produceren dat we de aarde niet uitputten, zodat ook toekomstige generaties goed kunnen leven.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is CO₂?</span><span class="a">Koolstofdioxide: een broeikasgas dat vrijkomt bij het verbranden van fossiele brandstoffen, zoals in auto's, vliegtuigen en verwarming. Het houdt warmte vast in de atmosfeer. Bomen nemen CO₂ op.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is ontbossing?</span><span class="a">Het op grote schaal kappen van bossen, bijvoorbeeld in de Amazone, om plaats te maken voor landbouw, weiden of soja voor veevoer. Minder bomen betekent minder CO₂ dat wordt opgenomen en minder biodiversiteit.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn herkauwers en wat is methaangas?</span><span class="a">Herkauwers: dieren met meerdere magen die hun voedsel herkauwen, zoals koeien, schapen en geiten.<br>Methaangas: een broeikasgas dat herkauwers vooral uitboeren bij de vertering. Het houdt ongeveer 25 keer meer warmte vast dan CO₂.</span></button></li>
  </ol>
