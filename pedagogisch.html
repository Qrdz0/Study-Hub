  <h1>Pedagogisch handelen</h1>

<main>
  <div class="tools">
    <p class="meta">Examen ma 7 december · 17 kaarten</p>
    <button class="toggle" id="mode" aria-pressed="true">Studeermodus</button>
  </div>
  <progress id="bar" aria-label="Voortgang"></progress>
  <ol class="deck">
    <li><button class="card" aria-pressed="false"><span class="q">Wat leer je in de richting Zorg en welzijn?</span><span class="a">Zorgen voor mensen in hun dagelijks leven, zoals kinderen, ouderen en personen met een beperking, met aandacht voor gezondheid, welzijn, voeding en het huishouden.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Waarom maak je klasafspraken?</span><span class="a">Ze zorgen voor duidelijkheid, veiligheid en respect. Als je ze samen opstelt, voelt iedereen zich meer betrokken en worden ze beter nageleefd.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe formuleer je een goede afspraak?</span><span class="a">Positief, concreet, kort en haalbaar. Bijvoorbeeld "We laten elkaar uitspreken" in plaats van "Niet onderbreken".</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is een mensbeeld?</span><span class="a">De manier waarop je naar de mens kijkt. Het bepaalt hoe je iemand benadert, verzorgt en begeleidt.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het holistisch mensbeeld?</span><span class="a">De mens is een geheel van lichaam, geest, sociale contacten en zingeving. Alles beïnvloedt elkaar, dus je zorgt voor de hele persoon.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het emancipatorisch mensbeeld?</span><span class="a">Iedereen is gelijkwaardig en heeft recht op eigen keuzes. Je versterkt de zelfstandigheid en laat de persoon zoveel mogelijk zelf beslissen.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het dynamisch mensbeeld?</span><span class="a">De mens verandert en ontwikkelt zich zijn hele leven. Begeleiding past zich aan die groei en veranderende situaties aan.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke behoeften staan in de piramide van Maslow?</span><span class="a">Van onder naar boven: lichamelijke behoeften, veiligheid, sociale behoeften (erbij horen), erkenning en waardering, zelfontplooiing.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is een talent?</span><span class="a">Iets waar je van nature goed in bent en energie van krijgt. Je ontdekt het via ervaringen en feedback van anderen, en zet het in voor jezelf en het team.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Uit welke elementen bestaat communicatie?</span><span class="a">Zender, boodschap, kanaal, ontvanger en feedback. Ruis kan de boodschap verstoren. Communicatie is verbaal en non-verbaal.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat doe je bij actief luisteren?</span><span class="a">Aandacht tonen (oogcontact, knikken), niet onderbreken, open vragen stellen, parafraseren, gevoelens benoemen en samenvatten.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de 4 stappen van verbindend communiceren?</span><span class="a">1. Waarneming zonder oordeel<br>2. Gevoel<br>3. Behoefte<br>4. Verzoek</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen een ik- en een jij-boodschap?</span><span class="a">Ik-boodschap: "Ik raak de draad kwijt als je praat terwijl ik uitleg." Jij-boodschap: "Jij stoort altijd." De ik-boodschap valt niet aan en houdt het gesprek open.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe schrijf je een professionele e-mail?</span><span class="a">Duidelijk onderwerp, correcte aanspreking ("Beste mevrouw Peeters"), korte kern, beleefde afsluiting ("Met vriendelijke groeten"), je naam en klas, spelling nalezen, bijlage vermelden.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke rollen kan je opnemen in een team?</span><span class="a">Bijvoorbeeld trekker of voorzitter, tijdsbewaker, verslaggever, materiaalverantwoordelijke en ideeënbedenker. Belbin onderscheidt 9 teamrollen, zoals voorzitter, plant, zorgdrager en specialist.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat maakt teamwerk goed?</span><span class="a">Een gemeenschappelijk doel, duidelijke taakverdeling, open communicatie, vertrouwen en feedback durven geven en ontvangen.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is diversiteit in een team en wat is de meerwaarde?</span><span class="a">Verschillen in achtergrond, cultuur, leeftijd, talenten en meningen. Het levert meer ideeën en perspectieven op, maar vraagt respect en een open houding.</span></button></li>
  </ol>
