<main>
  <div class="tools">

  </div>
  <progress id="bar" aria-label="Voortgang"></progress>
  <ol class="deck">
    <li><button class="card" aria-pressed="false"><span class="q">Hoe plan je het werk in de keuken?</span><span class="a">Recept lezen, een werkplan met tijdsschema maken, taken verdelen, mise-en-place doen en tussendoor opruimen.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is mise-en-place?</span><span class="a">Alle ingrediënten en materiaal klaarzetten en voorbereiden voor je begint te koken.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Noem vijf veiligheidsregels in de keuken</span><span class="a">Pannenstelen naar binnen, messen met de punt naar beneden dragen, ovenwanten gebruiken, elektrische toestellen met droge handen bedienen, gemorst vocht meteen opkuisen.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat doe je bij een vetbrand?</span><span class="a">Nooit water gebruiken. Vuur uitzetten en de pan afdekken met een deksel of blusdeken.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke regels gelden voor persoonlijke hygiëne?</span><span class="a">Handen wassen, haar samenbinden, propere schort, juwelen uit, wondjes afdekken, niet koken als je ziek bent.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is kruisbesmetting en hoe voorkom je het?</span><span class="a">Bacteriën gaan over van rauw naar bereid voedsel. Gebruik aparte snijplanken en messen, was je handen tussendoor en bewaar rauw vlees onderaan in de koelkast.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke temperaturen zijn belangrijk voor voedselveiligheid?</span><span class="a">Koelkast 4 °C of lager, diepvries −18 °C, warm houden boven 60 °C. Daartussen groeien bacteriën snel.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het FIFO-principe?</span><span class="a">First in, first out: wat het eerst gekocht is, gebruik je eerst. Nieuwe voorraad zet je achteraan.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen THT en TGT?</span><span class="a">THT (ten minste houdbaar tot) gaat over kwaliteit, daarna vaak nog eetbaar: kijk, ruik, proef. TGT (te gebruiken tot) gaat over veiligheid, daarna niet meer eten.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe beperk je afval in de keuken?</span><span class="a">Plannen met een boodschappenlijst, juiste porties, restjes hergebruiken, THT en TGT correct lezen, afval sorteren in PMD, papier, glas, GFT en restafval.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is ergonomisch werken in de keuken?</span><span class="a">Werkblad op de juiste hoogte, rechte rug, tillen vanuit de knieën, veelgebruikte spullen binnen handbereik, en een logische werkdriehoek tussen koelkast, spoelbak en kookplaat.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe is de voedingsdriehoek opgebouwd?</span><span class="a">Een omgekeerde driehoek. Bovenaan (groen) eet je het meest: water, groenten, fruit, volle granen, peulvruchten, noten. In het midden (oranje) matig: zuivel, vis, gevogelte, eieren. Onderaan (rood) beperken: rood en bewerkt vlees. Snoep, frisdrank en alcohol staan buiten de driehoek.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de principes van evenwichtig eten?</span><span class="a">Gevarieerd, met mate, meer plantaardig dan dierlijk, voldoende water (ca. 1,5 liter per dag) en regelmatige maaltijden.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de 6 groepen voedingsstoffen?</span><span class="a">Eiwitten, koolhydraten, vetten (leveren energie), vitaminen, mineralen en water (leveren geen energie). Daarnaast zijn vezels belangrijk.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is de functie van eiwitten, koolhydraten en vetten?</span><span class="a">Eiwitten: bouwen en herstellen. Koolhydraten: snelle energie. Vetten: reserve-energie, warmte en transport van de vitaminen A, D, E en K.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat staat verplicht op een voedingsetiket?</span><span class="a">Productnaam, ingrediënten in dalende volgorde van gewicht, allergenen in het vet, nettohoeveelheid, houdbaarheidsdatum, voedingswaarde per 100 g, bewaaradvies en producent.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe dek je een tafel?</span><span class="a">Vork links, mes rechts met de snijkant naar het bord, soeplepel rechts naast het mes, dessertbestek boven het bord, glas rechtsboven boven het mes, servet links of op het bord.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe stel je een evenwichtig dagmenu op?</span><span class="a">Drie hoofdmaaltijden en eventueel twee tussendoortjes. Elke maaltijd bevat een graanproduct of aardappelen, groenten of fruit en een eiwitbron. Varieer over de dag en de week.</span></button></li>
  </ol>
