  <progress id="bar" aria-label="Voortgang"></progress>
  <ol class="deck">
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de 4 factoren van de cirkel van Sinner?</span><span class="a">Chemie (het product), mechanische actie (wrijven, schrobben), temperatuur en tijd.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is de regel van de cirkel van Sinner?</span><span class="a">Samen vormen de vier factoren altijd 100%. Wordt één factor kleiner, dan moeten de andere groter worden. Bijvoorbeeld: lagere temperatuur vraagt meer tijd of een sterker product.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke schoonmaaktechnieken ken je?</span><span class="a">Droog: stof afnemen, vegen, stofzuigen.<br>Vochtig: met een vochtige doek of mop.<br>Nat: dweilen, schrobben, afwassen.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">In welke volgorde maak je een ruimte schoon?</span><span class="a">Van boven naar onder, van proper naar vuil, en van achter in de ruimte naar de deur toe.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Waarom werk je met kleurcodes voor doeken?</span><span class="a">Elke zone krijgt een eigen kleur (bv. rood voor het toilet), zo verspreid je geen bacteriën van vuile naar propere zones.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Waarom ventileer je een klaslokaal?</span><span class="a">Om CO₂, vocht en virussen af te voeren. Frisse lucht verbetert de concentratie en verkleint de kans op besmetting.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe ventileer je een klas goed?</span><span class="a">Ramen en deuren tegenover elkaar openzetten (dwarsventilatie), zeker tijdens pauzes. Richtwaarde CO₂-meter: onder 900 ppm is goed, boven 1200 ppm moet je verluchten.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat betekenen de 5 basissymbolen op een wasetiket?</span><span class="a">Wastobbe: wassen<br>Driehoek: bleken<br>Vierkant: drogen (cirkel erin: droogkast)<br>Strijkijzer: strijken<br>Cirkel: professioneel reinigen<br>Een kruis erdoor betekent: niet doen.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat betekenen de punten in het strijkijzer?</span><span class="a">1 punt: laag, ca. 110 °C (synthetisch)<br>2 punten: middel, ca. 150 °C (wol, zijde)<br>3 punten: hoog, ca. 200 °C (katoen, linnen)</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de stappen van het wasproces?</span><span class="a">Sorteren (kleur, stof, temperatuur), zakken leegmaken, vlekken voorbehandelen, wassen, spoelen, centrifugeren, drogen, strijken en plooien.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke soorten wasmiddelen ken je?</span><span class="a">Universeel wasmiddel (witte was, bevat bleekmiddel), kleurwasmiddel (zonder bleekmiddel), fijnwasmiddel (wol en zijde) en wasverzachter.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe werkt een wasmiddel?</span><span class="a">Oppervlakteactieve stoffen maken het vuil los van de vezel en houden het in het water. Enzymen breken vlekken van eiwit, vet of zetmeel af.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is de invloed van hard water op de was?</span><span class="a">Kalk vermindert de werking van het wasmiddel en zet zich af in de machine. Je doseert hoger of gebruikt een ontharder.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe was je zuinig?</span><span class="a">Volle trommel, lage temperatuur (30–40 °C), eco-programma, juiste dosis wasmiddel, geen voorwas als het niet nodig is, drogen aan de lijn in plaats van in de droogkast.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke soorten ovens ken je?</span><span class="a">Klassieke oven (boven- en onderwarmte), heteluchtoven (ventilator, ca. 20 °C lager instellen), microgolfoven (laat watermoleculen trillen) en combi-oven.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe reinig je een oven?</span><span class="a">Pyrolyse: de oven verbrandt het vuil tot as op ca. 500 °C. Katalyse: speciale wanden breken vet af tijdens het bakken. Manueel: afgekoeld, stekker uit, met soda of een ovenreiniger.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe gebruik je een oven zuinig?</span><span class="a">Alleen voorverwarmen als het recept het vraagt, de deur dicht houden, hetelucht gebruiken en de restwarmte benutten door de oven iets vroeger uit te zetten.</span></button></li>
  </ol>
