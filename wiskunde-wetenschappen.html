  <h1>Wiskunde & Wetenschappen</h1>

<main>
  <div class="tools">
    <p class="meta">Modules 7–16 · 20 kaarten</p>
    <button class="toggle" id="mode" aria-pressed="true">Studeermodus</button>
  </div>
  <progress id="bar" aria-label="Voortgang"></progress>
  <ol class="deck">
    <li><button class="card" aria-pressed="false"><span class="q">Hoe bereken je een temperatuurverschil over 0 °C heen?</span><span class="a">Tel de afstand tot 0 aan beide kanten op.<br>Van −5 °C naar 7 °C = 5 + 7 = 12 °C<br>Van 12 °C naar −3 °C = 12 + 3 = 15 °C<br>Van −8 °C naar −1 °C = 7 °C</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verband tussen straal en diameter?</span><span class="a">Diameter = 2 × straal.<br>r = 3,5 cm → d = 7 cm<br>r = 12 cm → d = 24 cm</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe bereken je de omtrek van een cirkel met straal 7 cm?</span><span class="a">Omtrek = 2 × r × π (of d × π)<br>2 × 7 cm × 3,14 = 43,96 cm</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe bereken je de oppervlakte van een cirkel met straal 7 cm?</span><span class="a">Oppervlakte = r × r × π<br>7 cm × 7 cm × 3,14 = 153,86 cm²</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen veelvouden en delers?</span><span class="a">Veelvouden: de tafel van het getal. Veelvouden van 6: 6, 12, 18, 24, 30.<br>Delers: getallen waar het getal precies door deelbaar is. Delers van 28: 1, 2, 4, 7, 14, 28.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wanneer is een getal deelbaar door 2, 5, 10 en 100?</span><span class="a">Door 2: laatste cijfer is even (46, 70, 102)<br>Door 5: eindigt op 0 of 5 (35, 90, 105)<br>Door 10: eindigt op 0 (40, 350)<br>Door 100: eindigt op 00 (200, 500)</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe bereken je 3/4 van 80?</span><span class="a">Deel door de noemer, vermenigvuldig met de teller.<br>80 : 4 = 20, 20 × 3 = 60</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe vereenvoudig je 14/42?</span><span class="a">Deel teller en noemer door hetzelfde getal, zo groot mogelijk.<br>14 : 14 = 1, 42 : 14 = 3 → 1/3</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe reken je 3/4 + 5/8 uit?</span><span class="a">Maak de breuken eerst gelijknamig.<br>6/8 + 5/8 = 11/8 = 1 en 3/8</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe reken je 5/6 − 1/3 uit?</span><span class="a">5/6 − 2/6 = 3/6 = 1/2</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe zet je een breuk om naar een kommagetal?</span><span class="a">Deel de teller door de noemer.<br>3/5 = 0,6<br>1/4 = 0,25<br>1/8 = 0,125</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe bereken je 15% van 200?</span><span class="a">Deel door 100, vermenigvuldig met het percentage.<br>200 : 100 = 2, 2 × 15 = 30</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Schrijf 25%, 40%, 75% en 5% als breuk</span><span class="a">25% = 25/100 = 1/4<br>40% = 40/100 = 2/5<br>75% = 75/100 = 3/4<br>5% = 5/100 = 1/20</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Een jas kost €120 met 30% korting. Hoeveel betaal je?</span><span class="a">Korting: 30% van 120 = €36<br>Nieuwe prijs: 120 − 36 = €84</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Schaal 1 : 50.000. Hoe ver is 8 cm op de kaart in werkelijkheid?</span><span class="a">8 × 50.000 = 400.000 cm = 4 km</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Een luis is getekend op schaal 10 : 1, de tekening is 3,5 cm. Hoe groot is de luis?</span><span class="a">Vergroting, dus delen door 10.<br>3,5 cm : 10 = 0,35 cm = 3,5 mm</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe herleid je volume-eenheden?</span><span class="a">Elke stap is × 1000. 1 m³ = 1000 dm³, 1 dm³ = 1000 cm³ = 1 liter.<br>2 m³ + 500 dm³ = 2,5 m³<br>5 dm³ − 300 cm³ = 4700 cm³</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe bereken je het volume en de oppervlakte van een balk?</span><span class="a">Volume = l × b × h<br>8 × 5 × 3 = 120 cm³<br>Oppervlakte = 2 × (l × b + l × h + b × h)<br>l 10, b 4, h 5 → 2 × (40 + 50 + 20) = 220 cm²</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn evenwijdige, snijdende en kruisende ribben?</span><span class="a">Evenwijdig: zelfde richting, raken nooit (AB en EF)<br>Snijdend: raken elkaar in één punt (AB en AE)<br>Kruisend: niet evenwijdig en raken nooit (AB en CG)</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Een kubusvormig aquarium heeft zijde 40 cm. Hoeveel liter past erin?</span><span class="a">Volume = z × z × z = 40 × 40 × 40 = 64.000 cm³ = 64 liter.<br>Eén glazen zijde: 40 × 40 = 1600 cm².<br>Oppervlakte kubus = 6 × z².</span></button></li>
  </ol>
