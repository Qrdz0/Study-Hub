      <h1>Gezondheid en welzijn</h1>
    </div>
    <button class="toggle" id="mode" aria-pressed="true">Studeermodus</button>
  </header>
  <ol class="deck">
    <li><button class="card" aria-pressed="false"><span class="q">Wat is gezondheid volgens de WHO?</span><span class="a">Een toestand van volledig lichamelijk, geestelijk en sociaal welbevinden, niet alleen de afwezigheid van ziekte of gebrek.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is het verschil tussen gezond en ziek zijn?</span><span class="a">Het is geen aan/uit-knop maar een glijdende schaal. Ziek zijn is een verstoring van het lichamelijk, psychisch of sociaal evenwicht. Je kan je gezond voelen met een chronische ziekte.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke factoren bepalen je gezondheid?</span><span class="a">Erfelijkheid, levensstijl (voeding, beweging, slaap, roken), omgeving (fysiek en sociaal) en toegang tot gezondheidszorg.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is een duurzame levensstijl?</span><span class="a">Leven op een manier die goed is voor je eigen gezondheid en tegelijk de aarde en toekomstige generaties niet schaadt.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Geef vijf voorbeelden van duurzame keuzes</span><span class="a">Fietsen of wandelen, kraantjeswater drinken, seizoens- en streekproducten kopen, minder vlees eten, restjes verwerken, afval sorteren.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de 6 algemene principes van eerste hulp?</span><span class="a">1. Denk aan je eigen veiligheid<br>2. Blijf kalm<br>3. Stel het slachtoffer gerust<br>4. Laat het slachtoffer niet alleen<br>5. Verplaats het slachtoffer niet onnodig<br>6. Ken je grenzen en vraag tijdig hulp</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat zijn de 4 stappen van eerste hulp?</span><span class="a">1. Zorg voor veiligheid<br>2. Beoordeel de toestand van het slachtoffer<br>3. Verwittig de hulpdiensten (112)<br>4. Verleen verdere eerste hulp</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe verzorg je een kleine snijwonde?</span><span class="a">Handen wassen of handschoenen aan, de wonde spoelen met lauw stromend water, ontsmetten met een kleurloos ontsmettingsmiddel, afdekken met een pleister of steriel kompres.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wanneer moet een wonde naar de dokter?</span><span class="a">Als ze diep of gapend is, blijft bloeden, vuil bevat dat niet weggaat, een bijtwonde is, in het gezicht zit of als de tetanusvaccinatie niet in orde is.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat doe je bij een sterk bloedende wonde?</span><span class="a">Laat het slachtoffer liggen, druk met een steriel kompres rechtstreeks op de wonde, leg een drukverband aan en bel 112.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is de eerste hulp bij een brandwonde?</span><span class="a">Minstens 10 minuten koelen met lauw stromend water. Kleding en juwelen verwijderen tenzij ze vastkleven. Steriel afdekken. Geen zalf, boter of ijs.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Hoe herken je de drie graden van brandwonden?</span><span class="a">1e graad: rood en pijnlijk (zoals zonnebrand)<br>2e graad: blaren<br>3e graad: wit of zwart, gevoelloos</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wanneer moet een brandwonde naar de dokter?</span><span class="a">Bij 2e of 3e graad groter dan een handpalm, brandwonden in het gezicht, aan handen, voeten of geslachtsdelen, en altijd bij jonge kinderen.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Welke weg legt voedsel af in het lichaam?</span><span class="a">Mond → keelholte → slokdarm → maag → dunne darm → dikke darm → endeldarm → anus.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat gebeurt er in de mond en de maag?</span><span class="a">Mond: kauwen en speeksel, de vertering van zetmeel start. Maag: maagsap met zoutzuur doodt bacteriën en start de eiwitvertering, het voedsel wordt een brij.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat gebeurt er in de dunne en de dikke darm?</span><span class="a">Dunne darm: verdere vertering met gal en alvleessap, voedingsstoffen gaan via de darmvlokken naar het bloed. Dikke darm: water en zouten worden opgenomen, de resten worden ontlasting.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">Wat is de energiebalans?</span><span class="a">Het evenwicht tussen energie-inname (voeding) en energieverbruik (basisstofwisseling en beweging). Meer inname dan verbruik geeft gewichtstoename, minder geeft gewichtsverlies.</span></button></li>
    <li><button class="card" aria-pressed="false"><span class="q">In welke eenheid druk je energie uit?</span><span class="a">In kilocalorieën (kcal) of kilojoule (kJ). 1 kcal ≈ 4,2 kJ.</span></button></li>
  </ol>
